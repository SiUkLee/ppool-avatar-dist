<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PPool Avatar · 설치 QR</title>
<style>
  :root { color-scheme: light dark; --fg:#111; --sub:#666; --bg:#fff; --card:#f5f5f7; --line:#e5e5ea; }
  @media (prefers-color-scheme: dark) {
    :root { --fg:#f2f2f7; --sub:#a1a1aa; --bg:#000; --card:#1c1c1e; --line:#2c2c2e; }
  }
  * { box-sizing: border-box; }
  body { margin:0; padding:40px 20px; background:var(--bg); color:var(--fg);
         font-family:-apple-system, system-ui, "Segoe UI", sans-serif;
         display:flex; flex-direction:column; align-items:center; gap:8px; }
  h1 { font-size:26px; margin:0; letter-spacing:-0.02em; }
  .sub { color:var(--sub); font-size:14px; margin:0 0 20px; text-align:center; }
  .grid { display:flex; flex-wrap:wrap; gap:20px; justify-content:center; width:100%; max-width:760px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:20px;
          padding:24px; flex:1 1 320px; max-width:360px; text-align:center; }
  .card h2 { font-size:18px; margin:0 0 4px; }
  .card .tag { font-size:12px; color:var(--sub); margin:0 0 16px; }
  .qr { background:#fff; border-radius:14px; padding:12px; display:inline-block; line-height:0; }
  .qr img { width:100%; max-width:240px; height:auto; image-rendering:pixelated; }
  .link { display:block; margin-top:14px; font-size:11px; color:var(--sub);
          word-break:break-all; text-decoration:none; }
  .note { max-width:600px; background:#fff6e5; color:#7a5b00; border-radius:12px;
          padding:14px 16px; font-size:13px; line-height:1.7; margin-top:12px; }
  @media (prefers-color-scheme: dark) { .note { background:#332a10; color:#ffd479; } }
  .note b { font-weight:700; }
  ul { margin:6px 0 0; padding-left:20px; }
</style>
</head>
<body>
  <h1>PPool Avatar 설치</h1>
  <p class="sub">휴대폰 카메라로 QR을 스캔하세요.</p>

  <div class="grid">
    <div class="card">
      <h2>📱 iOS</h2>
      <p class="tag">아이폰 · Safari로 열림</p>
      <div class="qr"><img src="qr_ios.png" alt="iOS 설치 QR"></div>
      <a class="link" href="../ios/">../ios/</a>
    </div>

    <div class="card">
      <h2>🤖 Android</h2>
      <p class="tag">안드로이드 · APK 다운로드</p>
      <div class="qr"><img src="qr_android.png" alt="Android 설치 QR"></div>
      <a class="link" href="../android/">../android/</a>
    </div>
  </div>

  <div class="note">
    <b>설치 전 확인</b>
    <ul>
      <li><b>iOS</b>: 반드시 <b>Safari</b>로 열어야 설치됩니다. 설치 후
          <b>설정 → 일반 → VPN 및 기기 관리</b>에서
          <b>Smilegate Megaport</b>를 <b>신뢰</b>해야 실행됩니다.</li>
      <li><b>Android</b>: "출처를 알 수 없는 앱 설치"를 허용해야 합니다.</li>
    </ul>
  </div>
</body>
</html>
