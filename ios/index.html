<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PPool Avatar · iOS 설치</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: -apple-system, system-ui, sans-serif; margin: 0; padding: 32px 20px;
         display: flex; flex-direction: column; align-items: center; gap: 20px; }
  .card { max-width: 420px; width: 100%; text-align: center; }
  h1 { font-size: 22px; margin: 8px 0; }
  p { color: #666; font-size: 14px; line-height: 1.6; }
  a.btn { display: block; padding: 16px; border-radius: 14px; background: #007aff; color: #fff;
          text-decoration: none; font-weight: 700; font-size: 17px; margin: 16px 0; }
  ol { text-align: left; color: #666; font-size: 13px; line-height: 1.7; }
  .ver { display:inline-block; font-size:12px; color:#888; border:1px solid #d0d0d5; border-radius:999px; padding:4px 12px; margin:0; }
  .warn { background: #fff6e5; color: #7a5b00; border-radius: 10px; padding: 12px; font-size: 13px; }
  @media (prefers-color-scheme: dark) { body { background:#000; color:#eee } p,ol{color:#aaa} .warn{background:#332a10;color:#ffd479} .ver{color:#999;border-color:#3a3a3c} }
</style>
</head>
<body>
  <div class="card">
    <h1>📱 PPool Avatar 설치 (iOS)</h1>
    <p class="ver">버전 1.3 (build 12) · 2026-08-28</p>
    <p>아이폰 Safari에서 아래 버튼을 누르면 설치됩니다.</p>
    <a class="btn" id="install" href="#">앱 설치하기</a>
    <div class="warn">
      설치 후 <b>설정 → 일반 → VPN 및 기기 관리</b>에서
      <b>Smilegate Megaport</b> 개발자를 <b>신뢰</b>해야 실행됩니다.
    </div>
    <ol>
      <li>이 페이지를 <b>아이폰 Safari</b>로 여세요 (크롬 X).</li>
      <li>"앱 설치하기" → "설치" 확인.</li>
      <li>홈 화면에서 아이콘 확인 후, 위 안내대로 개발자 신뢰.</li>
    </ol>
  </div>
<script>
  // 현재 위치 기준 manifest.plist 절대 URL. iOS OTA 는 HTTPS 필수라 https 로 강제.
  var manifestUrl = new URL('manifest.plist', window.location.href).href.replace(/^http:/, 'https:');
  document.getElementById('install').href =
    'itms-services://?action=download-manifest&url=' + encodeURIComponent(manifestUrl);
</script>
</body>
</html>
